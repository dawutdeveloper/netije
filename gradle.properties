# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 9.x: TEMPORARILY disable built-in Kotlin mode to keep using kapt for Hilt + Room.
# This is the workaround explicitly documented in the AGP 9.4.0 failure output:
#   "set android.builtInKotlin=false and android.newDsl=false to temporarily bypass".
# Safe until we migrate annotation processors to KSP in a future iteration.
android.builtInKotlin=false
android.newDsl=false
# Suppress the two AGP deprecation warnings this bypass triggers.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

android.nonTransitiveRClass=true

# Hilt 2.61+ aggregating task mode — required for AGP 9.x when newDsl=false (see Hilt release notes).
# Must be defined both here (Gradle apply-time lookup) AND in android hilt{} DSL inside app/build.gradle.kts.
hilt.enableAggregatingTask=true
